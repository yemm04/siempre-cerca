<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Siempre Cerca — Red comunitaria que reduce el tiempo de respuesta ante el extravío de una persona o mascota en Lima, Perú." />
  <meta name="theme-color" content="#2D6A4F" />

  <title>Siempre Cerca — Red comunitaria Lima</title>

  <!-- Fuentes: DM Sans y Lora desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@1,500;1,600&display=swap"
    rel="stylesheet"
  />

  <!-- Leaflet CSS (mapa) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Sistema de estilos modular -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/create-case.css" />
  <link rel="stylesheet" href="css/case-review.css" />
  <link rel="stylesheet" href="css/case-detail.css" />
  <link rel="stylesheet" href="css/case-actions.css" />
  <link rel="stylesheet" href="css/community.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/admin-tables.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Contenedor principal donde el router inyecta cada pantalla -->
  <div id="app" role="main">
    <!-- El contenido se carga dinámicamente vía router hash -->
    <div class="loading-splash">
      <div class="logo">
        <div class="logo-mark">
          <span class="leaf one"></span>
          <span class="leaf two"></span>
          <span class="leaf three"></span>
          <div class="people"><span></span><span></span><span></span></div>
        </div>
        <div class="logo-name">Siempre<br><em>Cerca</em></div>
      </div>
    </div>
  </div>

  <!-- Contenedor de toasts (notificaciones flotantes) -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Leaflet JS (mapa) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Punto de entrada de la aplicación (módulos ES) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
